name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      archive_version: ${{ steps.release.outputs.archive_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            archive_version="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            IFS=. read -r major minor patch <<<"${base_tag:-v0.0.0}"
            # Nightlies must outrank the last stable release and never regress, so
            # claim the smallest version greater than it rather than guessing higher.
            base_version="${major#v}.${minor}.$((patch + 1))"

            short_sha="${GITHUB_SHA::7}"
            archive_version="${base_version}-nightly-${GITHUB_RUN_ID}-${short_sha}"
            release_tag="nightly-${archive_version}"
          fi

          {
            echo "archive_version=${archive_version}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

  build-macos:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: darwin-arm64
            runner: xcode-27
    name: Build (${{ matrix.name }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true

      - name: Validate signing secrets
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ github.ref_type == 'tag' && secrets.APPLE_RELEASE_PROVISIONING_PROFILE_BASE64 || secrets.APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}"
          test -n "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_NOTARY_ISSUER_ID}"
          test -n "${APPLE_NOTARY_KEY}"
          test -n "${APPLE_NOTARY_KEY_ID}"
          test -n "${APPLE_PROVISIONING_PROFILE_BASE64}"

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Write provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ github.ref_type == 'tag' && secrets.APPLE_RELEASE_PROVISIONING_PROFILE_BASE64 || secrets.APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profile="${RUNNER_TEMP}/MiniWhisper.provisionprofile"
          printf '%s' "${APPLE_PROVISIONING_PROFILE_BASE64}" | /usr/bin/base64 -D > "${profile}"
          chmod 600 "${profile}"
          echo "APPLE_PROVISIONING_PROFILE_PATH=${profile}" >> "${GITHUB_ENV}"

      - name: Write Apple API key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          {
            echo "APPLE_NOTARY_KEY_PATH=${key_path}"
            echo "APPLE_NOTARY_KEY_ID=${APPLE_NOTARY_KEY_ID}"
            echo "APPLE_NOTARY_ISSUER_ID=${APPLE_NOTARY_ISSUER_ID}"
          } >> "${GITHUB_ENV}"

      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s '\n ' '-')" >> "${GITHUB_OUTPUT}"

      # Saved once per toolchain, dependency set, and build script, so it never grows run over run.
      # Modules edited since the save recompile; the dependencies, nearly all of the compile time,
      # hit. The script is in the key because its flags and paths are compile inputs too.
      - name: Cache compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/release/CompilationCache
          key: release-cas-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('MiniWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.resolved', 'scripts/build-release-archive.sh') }}

      # Restores the checkouts and binary artifacts at exactly the resolved versions, so the archive
      # clones nothing. The bare repositories, most of the size, stay out: Xcode builds from the
      # checkouts without them. With no restore-keys, a dependency bump resolves from scratch
      # rather than updating checkouts whose repositories are gone.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/release/SourcePackages/*
            !.build/release/SourcePackages/repositories
          key: release-packages-${{ runner.os }}-${{ hashFiles('MiniWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.swift') }}

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.archive_version }}
          RELEASE_CHANNEL: ${{ github.ref_type == 'tag' && 'release' || 'nightly' }}
          RELEASE_SIGNING: 1
        run: scripts/build-release-archive.sh

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${APPLE_NOTARY_KEY_PATH:-}" ]]; then
            rm -f "${APPLE_NOTARY_KEY_PATH}"
          fi
          if [[ -n "${APPLE_PROVISIONING_PROFILE_PATH:-}" ]]; then
            rm -f "${APPLE_PROVISIONING_PROFILE_PATH}"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-whisper-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [ci, resolve, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: mini-whisper-*
          merge-multiple: true

      - name: Publish tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          scripts/extract-release-notes.sh "$TAG" > /tmp/mini-whisper-release-notes.md
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/mini-whisper-release-notes.md

      - name: Publish main release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --prerelease \
              --latest=false \
              --notes "Automated release for ${GITHUB_SHA}."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --prerelease \
              --latest=false \
              --notes "Automated release for ${GITHUB_SHA}."
          fi

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [resolve, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: mini-whisper-*
          merge-multiple: true

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thurstonsand/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          path: homebrew-tap

      - name: Update cask
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          ASSET_VERSION: ${{ needs.resolve.outputs.archive_version }}
        run: |
          set -euo pipefail

          arm64_sha="$(cut -d ' ' -f 1 dist/MiniWhisper_*_darwin_arm64.zip.sha256)"

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            cask="homebrew-tap/Casks/mini-whisper.rb"
            token="mini-whisper"
            tag_prefix="v"
            cask_version="${RELEASE_REF_NAME#v}"
            app_name="MiniWhisper"
            bundle_id="com.thurstonsand.MiniWhisper"
            # Nightly tags outrank the stable one, so livecheck reads GitHub's latest release, which
            # skips prereleases.
            livecheck=$'\n  livecheck do\n    url :url\n    strategy :github_latest\n  end\n'
          else
            cask="homebrew-tap/Casks/mini-whisper-nightly.rb"
            token="mini-whisper-nightly"
            tag_prefix="nightly-"
            cask_version="${ASSET_VERSION}"
            app_name="MiniWhisper Nightly"
            bundle_id="com.thurstonsand.MiniWhisper.nightly"
            livecheck=$'\n  livecheck do\n    skip "Nightly builds are published from main."\n  end\n'
          fi

          cat > "${cask}" <<EOF
          # typed: strict
          # frozen_string_literal: true

          cask "${token}" do
            version "${cask_version}"
            sha256 "${arm64_sha}"

            url "https://github.com/thurstonsand/mini-whisper/releases/download/${tag_prefix}#{version}/MiniWhisper_#{version}_darwin_arm64.zip"
            name "${app_name}"
            desc "Local speech-to-text dictation"
            homepage "https://github.com/thurstonsand/mini-whisper"
          ${livecheck}
            depends_on arch: :arm64
            depends_on macos: :tahoe

            app "${app_name}.app"

            # This also removes the downloaded speech model.
            zap trash: [
              "~/Library/Application Support/${app_name}",
              "~/Library/Caches/${bundle_id}",
              "~/Library/HTTPStorages/${bundle_id}",
              "~/Library/Preferences/${bundle_id}.plist",
            ]
          end
          EOF

          ruby -c "${cask}"
          brew style "${cask}"

      - name: Commit cask update
        working-directory: homebrew-tap
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          ASSET_VERSION: ${{ needs.resolve.outputs.archive_version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks && [[ -z "$(git ls-files --others --exclude-standard Casks)" ]]; then
            echo "Cask is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            token="mini-whisper"
            git commit -m "mini-whisper ${RELEASE_REF_NAME#v}"
          else
            token="mini-whisper-nightly"
            git commit -m "mini-whisper-nightly ${ASSET_VERSION}"
          fi

          # brew audit reads casks from a tap, so audit the commit about to be pushed through one.
          brew tap thurstonsand/tap "$PWD"
          brew trust thurstonsand/tap
          brew audit --strict --cask "thurstonsand/tap/${token}"

          git push
