name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      CODE_SIGNING_ALLOWED: "NO"
      # xcodebuild hands only TEST_RUNNER_-prefixed variables to the test host, minus the prefix.
      TEST_RUNNER_CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true

      - name: Cache Swift dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build/DerivedData/SourcePackages
            Packages/*/.build
          key: ci-swift-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-${{ hashFiles('**/Package.swift') }}
          restore-keys: |
            ci-swift-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-
            ci-swift-${{ runner.os }}-

      - name: Lint
        run: mise run lint:static

      # `test` builds the app and its test targets, so a separate build step would
      # only recompile what the test run already covers.
      - name: Test app and UI
        run: mise run test

      - name: Test packages
        run: mise run test:packages
