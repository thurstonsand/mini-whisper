name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Lint
        run: mise run lint

      - name: Test app and UI
        run: mise run test

      - name: Test packages
        run: mise run test-packages
