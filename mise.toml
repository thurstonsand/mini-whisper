# MiniWhisper development environment
# Requires mise: `mise trust && mise bootstrap`

min_version = "2026.7.4"

[env]
HK_MISE = "1"
SCHEME = "MiniWhisper"
DEST = "platform=macOS,arch=arm64"
DERIVED_DATA = ".build/DerivedData"
APP_PATH = "{{ env.DERIVED_DATA }}/Build/Products/Debug/MiniWhisper Dev.app"
# Each channel is its own app: its own bundle identifier, so TCC grants never overlap, and its
# own application support directory, so settings, onboarding markers, and the engine model never
# overlap either. The OSLog subsystem stays shared so `mise run logs` covers all three.

[settings]
experimental = true

[hooks]
enter = "mise bootstrap --yes --quiet && ([ -f buildServer.json ] || mise run bsp >/dev/null)"

[tools]
"aqua:cpisciotta/xcbeautify" = "latest"
hk = "1.50.0"
swiftformat = "0.62.1"
markdownlint-cli2 = "0.23.1"
ruff = "0.15.14"
"http:xcode-build-server" = { version = "1.3.0", url = "https://github.com/SolaWing/xcode-build-server/archive/refs/tags/v{{ version }}.tar.gz", strip_components = 1, bin_path = "." }

[tasks.bootstrap]
description = "Install tools and git hooks"
run = [
    "mise install",
    "hk install --mise --quiet",
]
sources = ["mise.toml", "hk.pkl"]
outputs = [".git/config"]
quiet = true

# === App Build Targets ===

[tasks.build]
description = "Build the app"
run = """
xcodebuild -scheme $SCHEME \
    -destination "$DEST" \
    -derivedDataPath $DERIVED_DATA \
    -skipMacroValidation \
    -skipPackagePluginValidation \
    build | xcbeautify -q --disable-colored-output --disable-logging
"""

[tasks."build:quick"]
description = "Build without strict checks (faster iteration)"
run = """
xcodebuild -scheme $SCHEME \
    -destination "$DEST" \
    -derivedDataPath $DERIVED_DATA \
    -skipMacroValidation \
    -skipPackagePluginValidation \
    build | xcbeautify -q --disable-colored-output --disable-logging
"""

[tasks.logs]
description = "Stream MiniWhisper structured logs (also written to .build/miniwhisper.log)"
run = "mkdir -p .build && log stream --style compact --level info --predicate 'subsystem == \"com.thurstonsand.MiniWhisper\"' | tee .build/miniwhisper.log"

[tasks.mw]
description = "Build and run the app"
depends = ["build"]
run = 'open "$APP_PATH"'

[tasks."mw:fresh"]
description = "Build and run fresh; set FRESH_MODEL=1 to delete the speech model too"
depends = ["reset dev", "mw"]


[tasks.test]
description = "Run app unit tests (UI tests live in test:ui)"
run = """
xcodebuild -scheme $SCHEME \
    -destination "$DEST" \
    -derivedDataPath $DERIVED_DATA \
    -skipMacroValidation \
    -skipPackagePluginValidation \
    -skip-testing:MiniWhisperUITests \
    test | xcbeautify -q --disable-colored-output --disable-logging
"""

[tasks."test:ui"]
description = "Run interactive XCUITest suite (takes over the screen; run deliberately)"
run = """
xcodebuild -scheme $SCHEME \
    -destination "$DEST" \
    -derivedDataPath $DERIVED_DATA \
    -skipMacroValidation \
    -skipPackagePluginValidation \
    -only-testing:MiniWhisperUITests \
    test | xcbeautify -q --disable-colored-output --disable-logging
"""

# === Package Targets (fast, no Xcode overhead) ===

[tasks."build:packages"]
description = "Build all local packages"
run = """
for pkg in Packages/*/; do
    echo "Building $pkg..."
    swift build --package-path "$pkg" || exit 1
done
"""

[tasks."test:packages"]
description = "Test all local packages"
run = """
for pkg in Packages/*/; do
    swift test --quiet --package-path "$pkg" || exit 1
done
"""

[tasks.benchmark]
description = "Run deterministic interaction performance benchmarks"
run = [
    "swift test --package-path Packages/HotkeyListener --filter InteractionPerformanceBenchmarkTests",
    "swift test --package-path Packages/AudioCapture --filter InteractionPerformanceBenchmarkTests",
]

[tasks."benchmark:live"]
description = "Run the instrumented app interaction benchmark"
depends = ["build"]
run = "./scripts/benchmark_interactions"

# === Code Quality ===

[tasks.format]
description = "Format all Swift code"
run = "swiftformat MiniWhisper/ MiniWhisperTests/ MiniWhisperUITests/ Packages/"

[tasks."format:check"]
description = "Check formatting"
run = "swiftformat --lint --quiet MiniWhisper/ MiniWhisperTests/ MiniWhisperUITests/ Packages/"

[tasks."lint:markdown"]
description = "Lint Markdown documentation"
run = "markdownlint-cli2 \"**/*.md\""

[tasks."lint:python"]
description = "Check and lint Python code"
run = [
    "ruff format --check --quiet .",
    "ruff check --fix --unsafe-fixes --quiet .",
]

[tasks."lint:static"]
description = "Run the checks that need no compilation"
depends = ["format:check", "lint:markdown", "lint:python"]

[tasks.lint]
description = "Run pre-commit checks"
depends = ["lint:static", "build", "test:packages"]

# === Maintenance ===

[tasks.reset]
description = "Reset one channel's TCC grants and setup state"
dir = "{{ config_root }}"
usage = '''
arg "[channel]" help="Channel to reset" default="dev" {
    choices "dev" "nightly" "release"
}
'''
run = '''
channel="${usage_channel?}"
case "$channel" in
    dev)     app="MiniWhisper Dev";     bundle="com.thurstonsand.MiniWhisper.dev" ;;
    nightly) app="MiniWhisper Nightly"; bundle="com.thurstonsand.MiniWhisper.nightly" ;;
    release) app="MiniWhisper";         bundle="com.thurstonsand.MiniWhisper" ;;
    *) echo "unknown channel '$channel'; expected dev, nightly, or release" >&2; exit 1 ;;
esac

# Each channel's executable is named for its channel, so this can never reach a sibling.
pkill -x "$app" || true

tccutil reset Microphone "$bundle"
tccutil reset Accessibility "$bundle"
tccutil reset PostEvent "$bundle"
# The app has not asked for Input Monitoring since the tap became a modifying tap. Clearing it
# anyway keeps a grant from the listen-only era from ever masking a missing Accessibility grant.
tccutil reset ListenEvent "$bundle"

support="$HOME/Library/Application Support/$app"
rm -f "$support/onboarding-completed" "$support/model-download-consented"
if [ "${FRESH_MODEL:-0}" = "1" ]; then
    rm -rf "$support/Engine/pinned-v1" "$support/Engine/pinned-v1.partial"
fi

echo "reset $channel ($bundle)"
'''

[tasks.clean]
description = "Remove build artifacts"
run = """
rm -rf $DERIVED_DATA
rm -rf .build
for pkg in Packages/*/; do swift package --package-path "$pkg" clean; done
"""

# === Build Server ===

[tasks.bsp]
description = "Generate buildServer.json for LSP integration"
run = """
xcode-build-server config \
    -scheme $SCHEME \
    -workspace MiniWhisper.xcodeproj/project.xcworkspace \
    --build_root "$PWD/$DERIVED_DATA"
"""

[tasks."bsp:check"]
description = "Validate buildServer.json exists and is current"
run = """
if [ ! -f buildServer.json ]; then
    echo "buildServer.json not found. Run 'mise run bsp' to generate."
    exit 1
fi
echo "buildServer.json exists"
cat buildServer.json | head -20
"""
