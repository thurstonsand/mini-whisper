<!doctype html>
<meta charset="utf-8" />
<title>Adjudicate</title>
<style>
  :root {
    color-scheme: light dark;
    --edge: color-mix(in srgb, currentColor 14%, transparent);
    --dim: color-mix(in srgb, currentColor 55%, transparent);
    --sunk: color-mix(in srgb, canvas 92%, canvastext);
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.5 ui-sans-serif, -apple-system, system-ui;
    margin: 0 auto;
    max-width: 980px;
    padding: 20px 24px 60px;
  }
  header { align-items: baseline; display: flex; gap: 12px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .dim { color: var(--dim); }
  .reasons { margin: 6px 0 0; }
  .reason { color: var(--dim); font-size: 12px; }

  .player {
    align-items: center;
    background: var(--sunk);
    border: 1px solid var(--edge);
    border-radius: 10px;
    display: flex;
    gap: 12px;
    margin: 14px 0;
    padding: 10px 14px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .player button { min-width: 68px; }
  #scrub { flex: 1; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); }
  button, select {
    background: canvas;
    border: 1px solid var(--edge);
    border-radius: 7px;
    color: inherit;
    font: inherit;
    padding: 5px 12px;
  }
  button:hover { background: var(--sunk); }
  button.primary { background: AccentColor; border-color: AccentColor; color: AccentColorText; }
  button:disabled { opacity: 0.4; }

  .grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  label span { font-weight: 400; }
  textarea, input[type="text"] {
    background: canvas;
    border: 1px solid var(--edge);
    border-radius: 8px;
    color: inherit;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 10px 12px;
    resize: vertical;
    width: 100%;
  }
  textarea { min-height: 300px; white-space: pre-wrap; }
  textarea:focus, input:focus { border-color: AccentColor; outline: none; }
  .shipped {
    border-left: 2px solid var(--edge);
    color: var(--dim);
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 14px 0 0;
    padding-left: 12px;
    white-space: pre-wrap;
  }
  footer { align-items: center; display: flex; gap: 10px; margin-top: 16px; }
  footer .spacer { flex: 1; }
  kbd {
    background: var(--sunk);
    border: 1px solid var(--edge);
    border-radius: 4px;
    font: 11px ui-monospace, monospace;
    padding: 1px 5px;
  }
  .keys { color: var(--dim); font-size: 11px; margin-top: 18px; }
</style>

<header>
  <h1 id="when">…</h1>
  <span class="dim" id="app"></span>
  <span class="dim" id="position"></span>
  <span class="dim" id="saved"></span>
</header>
<ul class="reasons" id="reasons"></ul>

<div class="player">
  <button id="play">Play</button>
  <input type="range" id="scrub" value="0" min="0" max="1000" step="1" />
  <span id="clock">0:00 / 0:00</span>
  <select id="rate">
    <option value="0.75">0.75×</option>
    <option value="1" selected>1×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option>
  </select>
</div>
<audio id="audio" preload="auto"></audio>

<div class="grid">
  <div>
    <label for="say">Said <span class="dim">— verbatim, fillers and all</span></label>
    <textarea id="say" spellcheck="false"></textarea>
  </div>
  <div>
    <label for="expect">Wanted <span class="dim">— what should have been typed</span></label>
    <textarea id="expect" spellcheck="false"></textarea>
  </div>
</div>

<p class="shipped" id="shipped"></p>

<footer>
  <label for="tags" style="margin: 0">Tags</label>
  <input type="text" id="tags" placeholder="layout, hesitation, self-correction" style="max-width: 380px" />
  <span class="spacer"></span>
  <button id="prev">Previous</button>
  <button id="next">Skip</button>
  <button id="save" class="primary">Save &amp; next</button>
  <button id="quit">Done</button>
</footer>

<p class="keys">
  <kbd>space</kbd> play/pause anywhere but a text box ·
  <kbd>⌥←</kbd> <kbd>⌥→</kbd> seek 3s ·
  <kbd>⌘↵</kbd> save and next ·
  <kbd>⌘⇧←</kbd> <kbd>⌘⇧→</kbd> move between entries
</p>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const audio = $("audio");
  let queue = [];
  let index = 0;
  let dirty = false;

  const clock = (seconds) =>
    isFinite(seconds)
      ? `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`
      : "0:00";

  function render() {
    const entry = queue[index];
    $("when").textContent = entry.when;
    $("app").textContent = entry.app ?? "";
    $("position").textContent = `${index + 1} of ${queue.length}`;
    $("saved").textContent = entry.savedAs ? `saved as ${entry.savedAs}` : "";
    $("reasons").replaceChildren(
      ...entry.reasons.map((reason) => {
        const item = document.createElement("li");
        item.className = "reason";
        item.textContent = reason;
        return item;
      }),
    );
    $("say").value = entry.say ?? "";
    $("expect").value = entry.expect ?? "";
    $("tags").value = entry.tags ?? "";
    // What shipped, kept visible and uneditable: the boxes above are seeded from it, so once they
    // have been edited there is otherwise nothing left on screen saying what actually went wrong.
    $("shipped").textContent = entry.cleaned
      ? `shipped${entry.cleanupModel ? ` (${entry.cleanupModel})` : ""}: ${JSON.stringify(entry.cleaned)}`
      : "no cleanup ran on this one";
    audio.src = entry.hasAudio ? `/audio/${entry.source}` : "";
    $("play").disabled = !entry.hasAudio;
    $("scrub").disabled = !entry.hasAudio;
    $("prev").disabled = index === 0;
    // The last entry's button says what it will actually do, because a Save & next with no next
    // is a press that appears to do nothing at all.
    $("save").textContent = isLast() ? "Save & done" : "Save & next";
    $("next").disabled = isLast();
    dirty = false;
  }

  const isLast = () => index === queue.length - 1;

  async function stop(message) {
    await fetch("/api/quit", { method: "POST" });
    document.title = "Adjudicate — done";
    document.body.innerHTML = `<p style="padding:24px">${message} This window can be closed.</p>`;
  }

  function move(step) {
    const target = index + step;
    if (target < 0 || target >= queue.length) return;
    if (dirty && !confirm("Move on without saving this one?")) return;
    audio.pause();
    index = target;
    render();
  }

  async function save() {
    const entry = queue[index];
    const body = {
      source: entry.source,
      say: $("say").value,
      expect: $("expect").value,
      tags: $("tags").value,
    };
    const response = await fetch("/api/save", {
      method: "POST",
      body: JSON.stringify(body),
    });
    const { id } = await response.json();
    Object.assign(entry, { savedAs: id, say: body.say, expect: body.expect, tags: body.tags });
    dirty = false;
    if (!isLast()) {
      move(1);
      return;
    }
    audio.pause();
    await stop(`Saved as ${id}. Server stopped.`);
  }

  $("play").onclick = () => (audio.paused ? audio.play() : audio.pause());
  audio.onplay = () => ($("play").textContent = "Pause");
  audio.onpause = () => ($("play").textContent = "Play");
  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    $("scrub").value = String((audio.currentTime / audio.duration) * 1000);
    $("clock").textContent = `${clock(audio.currentTime)} / ${clock(audio.duration)}`;
  };
  audio.onloadedmetadata = audio.ontimeupdate;
  $("scrub").oninput = () => {
    if (audio.duration) audio.currentTime = ($("scrub").value / 1000) * audio.duration;
  };
  $("rate").onchange = () => (audio.playbackRate = Number($("rate").value));

  $("save").onclick = save;
  $("next").onclick = () => move(1);
  $("prev").onclick = () => move(-1);
  $("quit").onclick = async () => {
    if (dirty && !confirm("Quit without saving this one?")) return;
    await stop("Server stopped.");
  };
  for (const id of ["say", "expect", "tags"]) $(id).oninput = () => (dirty = true);

  addEventListener("keydown", (event) => {
    const typing = /^(TEXTAREA|INPUT)$/.test(event.target.tagName);
    if (event.key === " " && !typing) {
      event.preventDefault();
      audio.paused ? audio.play() : audio.pause();
    } else if (event.altKey && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
      // Alt rather than bare arrows: the whole point is scrubbing without leaving the text box.
      event.preventDefault();
      audio.currentTime = Math.max(0, audio.currentTime + (event.key === "ArrowRight" ? 3 : -3));
    } else if (event.metaKey && event.key === "Enter") {
      event.preventDefault();
      save();
    } else if (event.metaKey && event.shiftKey && event.key === "ArrowLeft") {
      event.preventDefault();
      move(-1);
    } else if (event.metaKey && event.shiftKey && event.key === "ArrowRight") {
      event.preventDefault();
      move(1);
    }
  });

  addEventListener("beforeunload", (event) => {
    if (dirty) event.preventDefault();
  });

  queue = await (await fetch("/api/queue")).json();
  render();
</script>
